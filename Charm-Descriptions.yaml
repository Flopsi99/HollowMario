    - "Lifeblood Heart: shared native blue health; equip/damage/reset pending."
    - "Lifeblood Core: shared native blue health; equip/damage/reset pending."
    - "Flukenest: native spell/projectiles retained; casts and Shaman combination pending."
    - "Shaman Stone: native spells retained; actual damage/size pending."
    - "Fragile / Unbreakable Heart: shared native maximum health; health/death/variant rules pending."
    - "Fragile / Unbreakable Greed: native enemy death Geo rules; Mario kills/death pending."
    - "Joni's Blessing: shared native converted blue health; restrictions/combinations pending."
    - "Shape of Unn: native moving focus during Knight control; visuals/return/combinations pending."
    - "Dream Wielder: actual Knight Dream Nail; timing/gain/handover pending."
    - "Spell Twister: native spell costs; actual casts pending."
    - "Deep Focus: native focus routine; amount/time/cancellation/combinations pending."
